---
- name: Install Java Docker Git
  hosts: servers
  become: yes

  tasks:

  - name: Update Packages
    apt:
      update_cache: yes

  - name: Install Java
    apt:
      name: openjdk-17-jdk
      state: present

  - name: Install Docker
    apt:
      name: docker.io
      state: present

  - name: Start Docker
    service:
      name: docker
      state: started
      enabled: yes

  - name: Add Ubuntu User
    user:
      name: ubuntu
      groups: docker
      append: yes

  - name: Install Git
    apt:
      name: git
      state: present
